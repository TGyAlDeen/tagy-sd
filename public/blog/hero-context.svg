<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" font-family="ui-monospace,Menlo,monospace">
  <style>
    .lbl{fill:#e5e7eb;font-size:15px;font-weight:600}
    .sub{fill:#71717a;font-size:12.5px}
    .cap{fill:#71717a;font-size:13px}
    .track{fill:#12131b;stroke:#23252f;stroke-width:1.2}
    @keyframes reqbar{0%{width:0}28%{width:340px}100%{width:340px}}
    @keyframes gobar{0%,20%{width:0}28%{width:100px}34%{width:118px}100%{width:118px}}
    @keyframes cancel{0%,26%{opacity:0}30%,100%{opacity:1}}
    @keyframes chop{0%,32%{opacity:0}36%,80%{opacity:1}88%,100%{opacity:0}}
    @keyframes fixbar{0%,6%{width:0}22%{width:238px}32%{width:388px}100%{width:388px}}
    @keyframes seg{0%,22%{opacity:0}26%,100%{opacity:1}}
    @keyframes fixnote{0%,34%{opacity:0}38%,100%{opacity:1}}
    .areq{animation:reqbar 12s linear infinite}
    .ago{animation:gobar 12s linear infinite}
    .acancel{animation:cancel 12s linear infinite}
    .achop{animation:chop 12s linear infinite}
    .afix{animation:fixbar 12s linear infinite}
    .aseg{animation:seg 12s linear infinite}
    .afixn{animation:fixnote 12s linear infinite}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}
      .areq{width:340px}.ago{width:118px}.afix{width:388px}
      .acancel,.afixn,.aseg{opacity:1}.achop{opacity:0}}
  </style>
  <rect width="1020" height="510" fill="#0f1017"/>

  <text class="lbl" x="60" y="60">the bug — a fire-and-forget write that inherited the request's context</text>

  <text class="sub" x="60" y="105">request ctx</text>
  <rect class="track" x="200" y="88" width="560" height="26" rx="7"/>
  <rect class="areq" x="200" y="88" height="26" rx="7" fill="#38bdf8" opacity="0.75"/>
  <g class="acancel" opacity="0">
    <line x1="540" y1="76" x2="540" y2="200" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text class="sub" x="548" y="82" fill="#f87171">handler returns — ctx cancelled</text>
  </g>

  <text class="sub" x="60" y="165">go cache.Set(ctx)</text>
  <rect class="track" x="200" y="148" width="560" height="26" rx="7"/>
  <rect class="ago" x="422" y="148" height="26" rx="7" fill="#f87171" opacity="0.7"/>
  <g class="achop" opacity="0">
    <text class="sub" x="560" y="166" fill="#f87171">✂ write cancelled mid-flight</text>
    <text class="sub" x="560" y="184" fill="#f87171">— the cache never warms</text>
  </g>

  <line x1="60" y1="248" x2="960" y2="248" stroke="#23252f" stroke-width="1.5" stroke-dasharray="6 8"/>

  <text class="lbl" x="60" y="296">the fix — no goroutine: the write is part of the request</text>

  <text class="sub" x="60" y="341">request ctx</text>
  <rect class="track" x="200" y="324" width="560" height="26" rx="7"/>
  <rect class="afix" x="200" y="324" height="26" rx="7" fill="#38bdf8" opacity="0.75"/>
  <g class="aseg" opacity="0">
    <line x1="438" y1="318" x2="438" y2="358" stroke="#30333f" stroke-width="1.5"/>
    <text class="sub" x="250" y="376">upstream call</text>
    <text class="sub" x="452" y="376" fill="#34d399">cache.Set — synchronous, milliseconds</text>
  </g>
  <g class="afixn" opacity="0">
    <text class="sub" x="608" y="341" fill="#34d399">✓ write completes, then respond</text>
  </g>

  <text class="cap" x="60" y="492">fire-and-forget with the request's ctx = fire-and-usually-cancel · detached work needs its own owned lifecycle</text>
</svg>
