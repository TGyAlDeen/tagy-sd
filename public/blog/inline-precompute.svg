<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 340" font-family="ui-monospace,Menlo,monospace">
  <style>
    .box{fill:#12131b;stroke:#23252f;stroke-width:1.5}
    .lbl{fill:#e5e7eb;font-size:15px;font-weight:600}
    .sub{fill:#71717a;font-size:12.5px}
    .line{stroke:#30333f;stroke-width:1.5;fill:none}
    .dot{fill:#818cf8;opacity:0}
    .fast{fill:#38bdf8;opacity:0}
    @keyframes slow{0%{transform:translate(240px,90px);opacity:0}4%{opacity:1}30%{transform:translate(470px,90px);opacity:1}34%{opacity:0}36%{transform:translate(560px,90px);opacity:0}40%{opacity:1}66%{transform:translate(790px,90px);opacity:1}70%,100%{opacity:0}}
    @keyframes fast1{0%,10%{transform:translate(190px,250px);opacity:0}12%{opacity:1}20%{transform:translate(360px,250px);opacity:1}22%,100%{opacity:0}}
    @keyframes fast2{0%,24%{transform:translate(520px,250px);opacity:0}26%{opacity:1}34%{transform:translate(680px,250px);opacity:1}36%,100%{opacity:0}}
    @keyframes fast3{0%,48%{transform:translate(190px,250px);opacity:0}50%{opacity:1}58%{transform:translate(360px,250px);opacity:1}60%,100%{opacity:0}}
    @keyframes fast4{0%,62%{transform:translate(520px,250px);opacity:0}64%{opacity:1}72%{transform:translate(680px,250px);opacity:1}74%,100%{opacity:0}}
    .aslow{animation:slow 12s linear infinite}
    .af1{animation:fast1 12s linear infinite}
    .af2{animation:fast2 12s linear infinite}
    .af3{animation:fast3 12s linear infinite}
    .af4{animation:fast4 12s linear infinite}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.dot,.fast{opacity:0}}
  </style>
  <rect width="1020" height="340" fill="#0f1017"/>

  <!-- top lane: batch -->
  <text class="sub" x="60" y="46" fill="#818cf8">03:00 — batch lane (slow is fine here)</text>
  <rect class="box" x="60" y="60" width="180" height="60" rx="10"/>
  <text class="lbl" x="150" y="86" text-anchor="middle">candidates</text>
  <text class="sub" x="150" y="106" text-anchor="middle">geo + budget filter</text>
  <line class="line" x1="240" y1="90" x2="466" y2="90"/><path d="M460 85 L470 90 L460 95" class="line"/>
  <rect class="box" x="470" y="60" width="180" height="60" rx="10"/>
  <text class="lbl" x="560" y="86" text-anchor="middle">score (XGBoost)</text>
  <text class="sub" x="560" y="106" text-anchor="middle">batched inference</text>
  <line class="line" x1="650" y1="90" x2="786" y2="90"/><path d="M780 85 L790 90 L780 95" class="line"/>
  <rect class="box" x="790" y="60" width="170" height="60" rx="10"/>
  <text class="lbl" x="875" y="86" text-anchor="middle">write ranked</text>
  <text class="sub" x="875" y="106" text-anchor="middle">MySQL + Redis</text>

  <line x1="60" y1="170" x2="960" y2="170" stroke="#23252f" stroke-width="1.5" stroke-dasharray="6 8"/>

  <!-- bottom lane: request -->
  <text class="sub" x="60" y="206" fill="#38bdf8">12:30 — request lane (fast, ML-free)</text>
  <rect class="box" x="60" y="220" width="130" height="60" rx="10"/>
  <text class="lbl" x="125" y="246" text-anchor="middle">user tap</text>
  <text class="sub" x="125" y="266" text-anchor="middle">mini-app</text>
  <line class="line" x1="190" y1="250" x2="356" y2="250"/><path d="M350 245 L360 250 L350 255" class="line"/>
  <rect class="box" x="360" y="220" width="160" height="60" rx="10"/>
  <text class="lbl" x="440" y="246" text-anchor="middle">Go API</text>
  <text class="sub" x="440" y="266" text-anchor="middle">indexed read</text>
  <line class="line" x1="520" y1="250" x2="676" y2="250"/><path d="M670 245 L680 250 L670 255" class="line"/>
  <rect class="box" x="680" y="220" width="280" height="60" rx="10"/>
  <text class="lbl" x="820" y="246" text-anchor="middle">card carousel in chat</text>
  <text class="sub" x="820" y="266" text-anchor="middle">same latency as any endpoint</text>

  <circle class="dot aslow" r="6"/>
  <circle class="fast af1" r="5.5"/>
  <circle class="fast af2" r="5.5"/>
  <circle class="fast af3" r="5.5"/>
  <circle class="fast af4" r="5.5"/>

  <text class="sub" x="60" y="318">two decoupled loops: if the top lane fails tonight, the bottom lane serves yesterday's results — never an error</text>
</svg>
