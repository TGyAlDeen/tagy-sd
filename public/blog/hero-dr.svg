<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" font-family="ui-monospace,Menlo,monospace">
  <style>
    .box{fill:#12131b;stroke:#23252f;stroke-width:1.5}
    .lbl{fill:#e5e7eb;font-size:15px;font-weight:600}
    .sub{fill:#71717a;font-size:12.5px}
    .cap{fill:#71717a;font-size:13px}
    .line{stroke:#30333f;stroke-width:1.5;fill:none}
    @keyframes repl{to{stroke-dashoffset:-36}}
    @keyframes tokyodim{0%,44%{opacity:1}50%,86%{opacity:0.32}94%,100%{opacity:1}}
    @keyframes xmark{0%,46%{opacity:0}50%,84%{opacity:1}90%,100%{opacity:0}}
    @keyframes promote{0%,52%{stroke:#23252f}58%,84%{stroke:#34d399}92%,100%{stroke:#23252f}}
    @keyframes traffic1{0%,4%{transform:translate(510px,74px);opacity:0}6%{opacity:1}16%{transform:translate(258px,120px);opacity:1}18%,100%{opacity:0}}
    @keyframes traffic2{0%,24%{transform:translate(510px,74px);opacity:0}26%{opacity:1}36%{transform:translate(258px,120px);opacity:1}38%,100%{opacity:0}}
    @keyframes traffic3{0%,58%{transform:translate(510px,74px);opacity:0}60%{opacity:1}70%{transform:translate(762px,120px);opacity:1}72%,100%{opacity:0}}
    @keyframes traffic4{0%,76%{transform:translate(510px,74px);opacity:0}78%{opacity:1}88%{transform:translate(762px,120px);opacity:1}90%,100%{opacity:0}}
    @keyframes rehearse{0%,50%{opacity:0}56%,86%{opacity:1}92%,100%{opacity:0}}
    .arepl{animation:repl 2.5s linear infinite}
    .atokyo{animation:tokyodim 14s linear infinite}
    .ax{animation:xmark 14s linear infinite}
    .aprom{animation:promote 14s linear infinite}
    .at1{animation:traffic1 14s linear infinite}.at2{animation:traffic2 14s linear infinite}
    .at3{animation:traffic3 14s linear infinite}.at4{animation:traffic4 14s linear infinite}
    .areh{animation:rehearse 14s linear infinite}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}circle{opacity:0}.atokyo{opacity:1}.ax,.areh{opacity:0}}
  </style>
  <rect width="1020" height="510" fill="#0f1017"/>

  <!-- dns -->
  <rect class="box" x="430" y="42" width="160" height="52" rx="10"/>
  <text class="lbl" x="510" y="74" text-anchor="middle">DNS / routing</text>
  <line class="line" x1="452" y1="94" x2="270" y2="128" stroke-dasharray="4 5"/>
  <line class="line" x1="568" y1="94" x2="750" y2="128" stroke-dasharray="4 5"/>

  <!-- Tokyo -->
  <g class="atokyo">
    <rect class="box" x="70" y="130" width="380" height="270" rx="14"/>
    <text class="lbl" x="90" y="164">Tokyo — primary</text>
    <text class="ax" x="410" y="166" fill="#f87171" font-size="17" font-weight="700" opacity="0">✗</text>
    <rect class="box" x="90" y="186" width="160" height="50" rx="8"/>
    <text class="sub" x="170" y="216" text-anchor="middle" fill="#a1a1aa">λ + API</text>
    <rect class="box" x="270" y="186" width="160" height="50" rx="8"/>
    <text class="sub" x="350" y="216" text-anchor="middle" fill="#a1a1aa">SQS pipeline</text>
    <rect class="box" x="90" y="256" width="160" height="50" rx="8"/>
    <text class="sub" x="170" y="286" text-anchor="middle" fill="#a1a1aa">Aurora — writer</text>
    <rect class="box" x="270" y="256" width="160" height="50" rx="8"/>
    <text class="sub" x="350" y="286" text-anchor="middle" fill="#a1a1aa">S3</text>
    <text class="sub" x="90" y="374">module set A · vars: tokyo</text>
  </g>

  <!-- Osaka -->
  <rect class="box" x="570" y="130" width="380" height="270" rx="14"/>
  <text class="lbl" x="590" y="164">Osaka — standby</text>
  <rect class="box" x="590" y="186" width="160" height="50" rx="8"/>
  <text class="sub" x="670" y="216" text-anchor="middle" fill="#a1a1aa">λ + API</text>
  <rect class="box" x="770" y="186" width="160" height="50" rx="8"/>
  <text class="sub" x="850" y="216" text-anchor="middle" fill="#a1a1aa">SQS pipeline</text>
  <rect class="box aprom" x="590" y="256" width="160" height="50" rx="8"/>
  <text class="sub" x="670" y="286" text-anchor="middle" fill="#a1a1aa">Aurora → writer</text>
  <rect class="box" x="770" y="256" width="160" height="50" rx="8"/>
  <text class="sub" x="850" y="286" text-anchor="middle" fill="#a1a1aa">S3 ← CRR</text>
  <text class="sub" x="590" y="374">module set A · vars: osaka</text>

  <!-- replication -->
  <line x1="450" y1="281" x2="570" y2="281" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 10" opacity="0.6" class="arepl"/>
  <text class="sub" x="510" y="270" text-anchor="middle">replication</text>

  <text class="sub areh" x="590" y="436" fill="#34d399" opacity="0">rehearsal: declare ▸ freeze ▸ promote ▸ repoint ▸ drain ▸ verify — on a stopwatch</text>

  <circle class="at1" r="5.5" fill="#38bdf8" opacity="0"/>
  <circle class="at2" r="5.5" fill="#38bdf8" opacity="0"/>
  <circle class="at3" r="5.5" fill="#34d399" opacity="0"/>
  <circle class="at4" r="5.5" fill="#34d399" opacity="0"/>

  <text class="cap" x="70" y="486">same Terraform modules, two regions — failover is a rehearsed sequence, not a diagram</text>
</svg>
